# Namespace, KubeVirt, the existing HAMi release, and a random-token Secret are
# installation prerequisites. This file does not create or alter a GPU platform.
apiVersion: flyt.dev/v1alpha1
kind: FlytControlPlane
metadata:
  name: main
  namespace: flyt-hami-stage3
spec:
  managerImage: registry.example.com/flyt/manager-stage3@sha256:REPLACE_WITH_DIGEST
  authSecretName: flyt-binding-auth
  clusterDomain: cluster.local
  imagePullSecrets: []
---
apiVersion: flyt.dev/v1alpha1
kind: FlytGPUProfile
metadata:
  name: gpu2-small
  namespace: flyt-hami-stage3
spec:
  approved: false
  nodeName: REPLACE_WITH_NODE
  gpuUUID: REPLACE_WITH_APPROVED_GPU_UUID
  cores: 30
  memoryMiB: 8192
  maxClients: 8
  workerImage: registry.example.com/flyt/worker-stage3@sha256:REPLACE_WITH_DIGEST
  runtimeClass: REPLACE_WITH_EXISTING_RUNTIMECLASS_OR_EMPTY
  hamiNamespace: flyt-hami-stage1
  schedulerName: flyt-hami-stage1
---
apiVersion: flyt.dev/v1alpha1
kind: FlytGPUProfile
metadata:
  name: gpu2-large
  namespace: flyt-hami-stage3
spec:
  approved: false
  nodeName: REPLACE_WITH_NODE
  gpuUUID: REPLACE_WITH_SAME_APPROVED_GPU_UUID
  cores: 70
  memoryMiB: 16384
  maxClients: 8
  workerImage: registry.example.com/flyt/worker-stage3@sha256:REPLACE_WITH_DIGEST
  runtimeClass: REPLACE_WITH_EXISTING_RUNTIMECLASS_OR_EMPTY
  hamiNamespace: flyt-hami-stage1
  schedulerName: flyt-hami-stage1
