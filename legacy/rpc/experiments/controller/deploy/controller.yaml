apiVersion: apps/v1
kind: Deployment
metadata:
  name: flyt-controller
  namespace: flyt-hami-stage3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flyt-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flyt-controller
    spec:
      serviceAccountName: flyt-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: registry.example.com/flyt/controller@sha256:REPLACE_WITH_DIGEST
          args: ["--namespace=flyt-hami-stage3"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
