# Create a new Profile; do not patch an existing immutable workerImage.
apiVersion: flyt.dev/v1alpha1
kind: FlytGPUProfile
metadata:
  name: gpu2-stage6
  namespace: flyt-hami-stage3
spec:
  approved: false
  nodeName: REPLACE_WITH_NODE
  gpuUUID: REPLACE_WITH_APPROVED_GPU_UUID
  cores: 100
  memoryMiB: 8192
  maxClients: 8
  workerImage: registry.example.com/flyt/worker-stage6-diagnostic@sha256:REPLACE_WITH_DIGEST
  runtimeClass: REPLACE_WITH_EXISTING_RUNTIMECLASS_OR_EMPTY
  hamiNamespace: flyt-hami-stage1
  schedulerName: flyt-hami-stage1
