apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: flyt-whole-gpu
  namespace: __FLYT_NAMESPACE__
  labels:
    app.kubernetes.io/part-of: flyt-poc
spec:
  metadata:
    labels:
      app.kubernetes.io/part-of: flyt-poc
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            allocationMode: ExactCount
            count: 1
            deviceClassName: gpu.nvidia.com
            selectors:
              - cel:
                  expression: >-
                    device.attributes['gpu.nvidia.com'].uuid == '__GPU_UUID__'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flyt-whole-gpu-cell-input
  namespace: __FLYT_NAMESPACE__
  labels:
    app.kubernetes.io/part-of: flyt-poc
data:
  entrypoint.sh: |-
    #!/usr/bin/env bash
    set -Eeuo pipefail
    mps_pipe=/run/flyt-mps/pipe
    mps_log=/var/log/flyt-mps
    cleanup() {
      set +e
      [[ -n "${NODE_MANAGER_PID:-}" ]] && kill -TERM "$NODE_MANAGER_PID" 2>/dev/null
      [[ -n "${NODE_MANAGER_PID:-}" ]] && wait "$NODE_MANAGER_PID" 2>/dev/null
      pkill -TERM -P 1 cricket-rpc-server 2>/dev/null
      printf 'quit\n' | CUDA_MPS_PIPE_DIRECTORY="$mps_pipe" \
        nvidia-cuda-mps-control 2>/dev/null
      [[ -n "${RPCBIND_PID:-}" ]] && kill -TERM "$RPCBIND_PID" 2>/dev/null
    }
    trap cleanup EXIT
    trap 'exit 0' INT TERM

    mapfile -t visible_uuids < <(
      nvidia-smi --query-gpu=uuid --format=csv,noheader | sed '/^[[:space:]]*$/d'
    )
    [[ ${#visible_uuids[@]} -eq 1 ]] || {
      echo "expected one DRA-injected whole GPU, observed ${#visible_uuids[@]}" >&2
      exit 1
    }
    [[ "${visible_uuids[0]}" == "$EXPECTED_GPU_UUID" ]] || {
      echo "expected $EXPECTED_GPU_UUID, observed ${visible_uuids[0]}" >&2
      exit 1
    }
    printf '%s\n' "${visible_uuids[0]}" > /run/flyt-mps/gpu.uuid

    install -d "$mps_pipe" "$mps_log" /run/rpcbind
    rpcbind -f -w &
    RPCBIND_PID=$!
    for _ in $(seq 1 20); do
      rpcinfo -p 127.0.0.1 >/dev/null 2>&1 && break
      kill -0 "$RPCBIND_PID"
      sleep 0.25
    done
    rpcinfo -p 127.0.0.1 >/dev/null

    export CUDA_VISIBLE_DEVICES=0
    export CUDA_MPS_PIPE_DIRECTORY="$mps_pipe"
    export CUDA_MPS_LOG_DIRECTORY="$mps_log"
    export CUDA_MPS_ENABLE_PER_CTX_DEVICE_MULTIPROCESSOR_PARTITIONING=1
    export LD_LIBRARY_PATH="/opt/flyt/bin:/usr/local/cuda/lib64"
    nvidia-cuda-mps-control -d

    probe_output="$(/workspace/out/experiment/cap_probe)"
    printf '%s\n' "$probe_output"
    grep -qx 'device_count=1' <<< "$probe_output"
    grep -qx "reported_sm=$EXPECTED_GPU_SM" <<< "$probe_output"
    grep -q 'checksum_ok=true' <<< "$probe_output"

    /opt/flyt/bin/flyt-node-manager &
    NODE_MANAGER_PID=$!
    wait "$NODE_MANAGER_PID"
---
apiVersion: v1
kind: Pod
metadata:
  name: flyt-gpu-cell
  namespace: __FLYT_NAMESPACE__
  labels:
    app: flyt-gpu-cell
    app.kubernetes.io/part-of: flyt-poc
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: __NODE_NAME__
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: flyt-whole-gpu
  containers:
    - name: gpu-cell
      image: docker.io/nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04@sha256:ad6d59a3bbf3e82c1c849c9ac09cfc2a3e0bbb8655042fd899be6681b3fe2a85
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |-
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            libelf1 libssl3 netbase procps rpcbind tini util-linux
          until test -f /workspace/BUILD_COMPLETE; do sleep 5; done
          install -d /opt/flyt/bin
          cp -a /workspace/out/gpu-cell/. /opt/flyt/bin/
          exec /usr/bin/tini -- /input/entrypoint.sh
      env:
        - name: EXPECTED_GPU_UUID
          value: __GPU_UUID__
        - name: EXPECTED_GPU_SM
          value: "__EXPECTED_MIG_SM__"
        - name: RUST_LOG
          value: info
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 24Gi
        claims:
          - name: gpu
      startupProbe:
        exec:
          command: ["/bin/bash", "-lc", "test -s /run/flyt-mps/gpu.uuid && pgrep -f '^/opt/flyt/bin/flyt-node-manager$' >/dev/null"]
        periodSeconds: 5
        failureThreshold: 120
      readinessProbe:
        exec:
          command: ["/bin/bash", "-lc", "pgrep -f '^/opt/flyt/bin/flyt-node-manager$' >/dev/null && rpcinfo -p 127.0.0.1 >/dev/null"]
        periodSeconds: 5
      securityContext:
        allowPrivilegeEscalation: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: workspace
          mountPath: /workspace
          readOnly: true
        - name: node-config
          mountPath: /etc/flyt/node-mgr.toml
          subPath: node-mgr.toml
          readOnly: true
        - name: input
          mountPath: /input
          readOnly: true
        - name: mps-run
          mountPath: /run/flyt-mps
        - name: mps-log
          mountPath: /var/log/flyt-mps
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: flyt-build
    - name: node-config
      configMap:
        name: flyt-config
    - name: input
      configMap:
        name: flyt-whole-gpu-cell-input
        defaultMode: 0755
    - name: mps-run
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    - name: mps-log
      emptyDir:
        sizeLimit: 1Gi
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flyt-whole-gpu-cell-ingress
  namespace: __FLYT_NAMESPACE__
spec:
  podSelector:
    matchLabels:
      app: flyt-gpu-cell
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: flyt-poc
      ports:
        - protocol: TCP
        - protocol: UDP
          port: 111
