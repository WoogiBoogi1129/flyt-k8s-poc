# New identities for an explicit runtime transition. Do not change the immutable
# images in existing Profile/ControlPlane objects or auto-restart existing VMs.
apiVersion: flyt.dev/v1alpha1
kind: FlytControlPlane
metadata:
  name: main-stage5
  namespace: flyt-hami-stage3
spec:
  managerImage: registry.example.com/flyt/manager-stage5@sha256:REPLACE_WITH_DIGEST
  authSecretName: flyt-binding-auth-stage5
  clusterDomain: cluster.local
  imagePullSecrets: []
---
apiVersion: flyt.dev/v1alpha1
kind: FlytGPUProfile
metadata:
  name: gpu2-stage5
  namespace: flyt-hami-stage3
spec:
  approved: false
  nodeName: REPLACE_WITH_NODE
  gpuUUID: REPLACE_WITH_APPROVED_GPU_UUID
  cores: 30
  memoryMiB: 8192
  maxClients: 8
  workerImage: registry.example.com/flyt/worker-stage5@sha256:REPLACE_WITH_DIGEST
  runtimeClass: REPLACE_WITH_EXISTING_RUNTIMECLASS_OR_EMPTY
  hamiNamespace: flyt-hami-stage1
  schedulerName: flyt-hami-stage1
