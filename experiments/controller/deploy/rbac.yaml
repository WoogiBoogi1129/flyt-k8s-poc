apiVersion: v1
kind: ServiceAccount
metadata:
  name: flyt-controller
  namespace: flyt-hami-stage3
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flyt-controller
  namespace: flyt-hami-stage3
rules:
  - apiGroups: [flyt.dev]
    resources: [flytgpuprofiles, flytcontrolplanes]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [flyt.dev]
    resources: [flytworkers]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [flyt.dev]
    resources: [flytgpuprofiles/status, flytcontrolplanes/status, flytworkers/status, flytgpuprofiles/finalizers, flytcontrolplanes/finalizers, flytworkers/finalizers]
    verbs: [get, patch, update]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstances, virtualmachineinstances/finalizers]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flyt-controller
  namespace: flyt-hami-stage3
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flyt-controller
subjects:
  - kind: ServiceAccount
    name: flyt-controller
    namespace: flyt-hami-stage3
---
# Read-only infrastructure observations. No GPU/node/plugin mutation privileges.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flyt-stage3-inventory-reader
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flyt-stage3-inventory-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flyt-stage3-inventory-reader
subjects:
  - kind: ServiceAccount
    name: flyt-controller
    namespace: flyt-hami-stage3
---
# Optional human read-only access. Bind explicitly; no automatic grants.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flyt-observer
  namespace: flyt-hami-stage3
rules:
  - apiGroups: [flyt.dev]
    resources: [flytgpuprofiles, flytcontrolplanes, flytworkers]
    verbs: [get, list, watch]
