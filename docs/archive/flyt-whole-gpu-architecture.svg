<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Flyt Kubernetes 단일 GPU 공유 아키텍처</title>
  <desc id="desc">Cluster Manager와 MongoDB로 구성된 제어 평면, GPU 없이 실행되는 두 KubeVirt VM, DRA로 GPU 2를 소유하는 GPU Cell과 CUDA MPS 및 Cricket RPC 데이터 경로를 표현한 구조도</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#152238" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3178c6"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e36b2c"/>
    </marker>
    <marker id="arrow-resource" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#238b72"/>
    </marker>
    <style>
      .bg { fill: #f4f7fb; }
      .cluster { fill: #ffffff; stroke: #aebbd0; stroke-width: 2; }
      .zone { fill: #f9fbff; stroke: #d5deec; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke-width: 1.5; filter: url(#shadow); }
      .control-card { stroke: #78a9df; }
      .vm-card { stroke: #9b85d6; }
      .gpu-card { stroke: #48a68e; }
      .node { fill: #f7faff; stroke: #8fa8ca; stroke-width: 1.2; }
      .vm-node { fill: #faf8ff; stroke: #a998d8; stroke-width: 1.2; }
      .gpu-node { fill: #f1fbf7; stroke: #61ad99; stroke-width: 1.2; }
      .rpc-node { fill: #fff7ee; stroke: #e7a263; stroke-width: 1.2; }
      .gpu-device { fill: #182635; stroke: #42c79d; stroke-width: 2; }
      .badge-blue { fill: #eaf3ff; stroke: #86b4e8; }
      .badge-purple { fill: #f1edff; stroke: #a995e0; }
      .badge-green { fill: #e8f8f2; stroke: #74bca8; }
      .badge-orange { fill: #fff0df; stroke: #e8ad71; }
      text { font-family: "Noto Sans KR", "Noto Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #17253a; }
      .title { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
      .subtitle { font-size: 16px; fill: #5a6b82; }
      .cluster-label { font-size: 17px; font-weight: 700; fill: #50617a; }
      .zone-title { font-size: 19px; font-weight: 800; }
      .card-title { font-size: 18px; font-weight: 800; }
      .node-title { font-size: 15px; font-weight: 700; }
      .body { font-size: 13px; fill: #50617a; }
      .small { font-size: 11px; fill: #63738a; }
      .white { fill: #ffffff; }
      .mono { font-family: "JetBrains Mono", "Noto Sans Mono", monospace; font-size: 12px; }
      .control-flow { fill: none; stroke: #3178c6; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrow-control); }
      .data-flow { fill: none; stroke: #e36b2c; stroke-width: 3; marker-end: url(#arrow-data); }
      .resource-flow { fill: none; stroke: #238b72; stroke-width: 2.5; marker-end: url(#arrow-resource); }
      .internal-flow { fill: none; stroke: #687a92; stroke-width: 1.7; marker-end: url(#arrow-control); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1050"/>

  <text class="title" x="58" y="52">Flyt on Kubernetes — 단일 GPU를 두 KubeVirt VM에 공유</text>
  <text class="subtitle" x="60" y="80">GPU는 GPU Cell만 소유하고, VM의 CUDA 호출은 Flyt/Cricket RPC를 통해 원격 실행된다.</text>
  <rect class="badge-green" x="1332" y="28" width="210" height="32" rx="16"/>
  <text class="small" x="1351" y="49">Running · 2026-08-18 UTC</text>

  <rect class="cluster" x="38" y="105" width="1524" height="895" rx="24"/>
  <rect class="badge-blue" x="62" y="126" width="184" height="34" rx="17"/>
  <text class="cluster-label" x="82" y="149">Kubernetes · gpu-worker-1</text>
  <text class="small" x="1380" y="147">namespace: flyt-system</text>

  <!-- Control plane -->
  <rect class="zone" x="70" y="178" width="1460" height="220" rx="18"/>
  <text class="zone-title" x="96" y="211">Control Plane</text>
  <text class="body" x="223" y="211">등록 · 배치 · 자원 요청량 변경 · 상태 관리</text>

  <rect class="card control-card" x="100" y="238" width="230" height="120" rx="14"/>
  <text class="card-title" x="124" y="269">실험 운영자 / flytctl</text>
  <text class="body" x="124" y="298">list-vms · list-servernodes</text>
  <text class="body" x="124" y="322">change-config</text>
  <rect class="badge-blue" x="124" y="333" width="101" height="18" rx="9"/>
  <text class="small" x="137" y="346">SM / VRAM 요청</text>

  <rect class="card control-card" x="455" y="226" width="360" height="145" rx="14"/>
  <text class="card-title" x="480" y="258">Flyt Cluster Manager</text>
  <text class="body" x="480" y="286">VM/client ↔ GPU Cell 매핑</text>
  <text class="body" x="480" y="310">Virtual Server lifecycle 및 자원 변경</text>
  <text class="small mono" x="480" y="342">TCP 12401 · 12402 · metrics 12403</text>

  <rect class="card control-card" x="930" y="226" width="300" height="145" rx="14"/>
  <text class="card-title" x="955" y="258">MongoDB</text>
  <text class="small mono" x="955" y="282">vm_required_resources</text>
  <line x1="955" y1="294" x2="1204" y2="294" stroke="#d8e1ef"/>
  <text class="body" x="955" y="316">VM A</text><text class="body mono" x="1050" y="316">46 SM · 8192 MiB</text>
  <text class="body" x="955" y="341">VM B</text><text class="body mono" x="1050" y="341">46 SM · 8192 MiB</text>

  <rect class="card gpu-card" x="1315" y="238" width="180" height="120" rx="14"/>
  <text class="card-title" x="1338" y="269">NVIDIA DRA</text>
  <text class="body" x="1338" y="298">ResourceClaim</text>
  <text class="small" x="1338" y="322">GPU 2 whole device</text>
  <rect class="badge-green" x="1338" y="333" width="96" height="18" rx="9"/>
  <text class="small" x="1352" y="346">MIG Disabled</text>

  <path class="control-flow" d="M 330 298 L 455 298"/>
  <path class="control-flow" d="M 815 298 L 930 298"/>

  <!-- Workload zone -->
  <rect class="zone" x="70" y="425" width="760" height="530" rx="18"/>
  <text class="zone-title" x="96" y="460">KubeVirt VM 영역</text>
  <text class="body" x="270" y="460">GPU PCI passthrough · /dev/nvidia* · DRA claim 없음</text>

  <!-- VM A -->
  <rect class="card vm-card" x="100" y="486" width="700" height="196" rx="16"/>
  <rect class="badge-purple" x="124" y="504" width="105" height="26" rx="13"/>
  <text class="node-title" x="145" y="522">VM A</text>
  <text class="small mono" x="248" y="522">flyt-vm-a · VM A IP</text>

  <rect class="vm-node" x="125" y="548" width="170" height="93" rx="10"/>
  <text class="node-title" x="150" y="576">PyTorch / CUDA App</text>
  <text class="small" x="150" y="600">custom PyTorch 2.11</text>
  <text class="small" x="150" y="620">CUDA 12.8 · sm_120</text>

  <rect class="vm-node" x="350" y="548" width="185" height="93" rx="10"/>
  <text class="node-title" x="376" y="576">CUDA Interposition</text>
  <text class="small mono" x="376" y="600">shared libcudart</text>
  <text class="small mono" x="376" y="620">cricket-client.so</text>

  <rect class="vm-node" x="590" y="548" width="180" height="93" rx="10"/>
  <text class="node-title" x="616" y="576">Flyt Client Manager</text>
  <text class="small" x="616" y="600">client 등록</text>
  <text class="small" x="616" y="620">Virtual Server 요청</text>

  <path class="internal-flow" d="M 295 594 L 350 594"/>
  <path class="internal-flow" d="M 535 594 L 590 594"/>

  <!-- VM B -->
  <rect class="card vm-card" x="100" y="718" width="700" height="196" rx="16"/>
  <rect class="badge-purple" x="124" y="736" width="105" height="26" rx="13"/>
  <text class="node-title" x="145" y="754">VM B</text>
  <text class="small mono" x="248" y="754">flyt-vm-b · VM B IP</text>

  <rect class="vm-node" x="125" y="780" width="170" height="93" rx="10"/>
  <text class="node-title" x="150" y="808">PyTorch / CUDA App</text>
  <text class="small" x="150" y="832">custom PyTorch 2.11</text>
  <text class="small" x="150" y="852">CUDA 12.8 · sm_120</text>

  <rect class="vm-node" x="350" y="780" width="185" height="93" rx="10"/>
  <text class="node-title" x="376" y="808">CUDA Interposition</text>
  <text class="small mono" x="376" y="832">shared libcudart</text>
  <text class="small mono" x="376" y="852">cricket-client.so</text>

  <rect class="vm-node" x="590" y="780" width="180" height="93" rx="10"/>
  <text class="node-title" x="616" y="808">Flyt Client Manager</text>
  <text class="small" x="616" y="832">client 등록</text>
  <text class="small" x="616" y="852">Virtual Server 요청</text>

  <path class="internal-flow" d="M 295 826 L 350 826"/>
  <path class="internal-flow" d="M 535 826 L 590 826"/>

  <!-- GPU Cell -->
  <rect class="zone" x="870" y="425" width="660" height="530" rx="18"/>
  <text class="zone-title" x="896" y="460">GPU Data Plane · GPU Cell Pod 1개</text>
  <text class="body" x="1226" y="460">물리 GPU 1개 전담</text>

  <rect class="card gpu-card" x="900" y="486" width="600" height="428" rx="16"/>
  <rect class="badge-green" x="924" y="504" width="170" height="26" rx="13"/>
  <text class="node-title" x="944" y="522">flyt-gpu-cell</text>
  <text class="small mono" x="1120" y="522">DRA whole GPU claim</text>

  <rect class="gpu-node" x="925" y="550" width="550" height="62" rx="10"/>
  <text class="node-title" x="950" y="578">Flyt Node Manager</text>
  <text class="body" x="1125" y="578">GPU 등록 · RPC Server 생성/정리 · 자원 설정 적용</text>

  <rect class="rpc-node" x="925" y="642" width="255" height="72" rx="10"/>
  <text class="node-title" x="950" y="671">Cricket RPC Server A</text>
  <text class="small" x="950" y="694">VM A CUDA API 실행</text>

  <rect class="rpc-node" x="1220" y="642" width="255" height="72" rx="10"/>
  <text class="node-title" x="1245" y="671">Cricket RPC Server B</text>
  <text class="small" x="1245" y="694">VM B CUDA API 실행</text>

  <rect class="gpu-node" x="925" y="744" width="550" height="58" rx="10"/>
  <text class="node-title" x="950" y="779">NVIDIA CUDA MPS</text>
  <text class="body" x="1135" y="779">동시 실행 · SM 실행 비율 관리</text>

  <rect class="gpu-device" x="925" y="828" width="550" height="62" rx="11"/>
  <text class="node-title white" x="950" y="856">GPU 2 · RTX PRO 6000 Blackwell Server Edition</text>
  <text class="small white" x="950" y="878">188 SM · 약 96 GiB VRAM · GPU UUID c654d43e…f46a</text>

  <path class="internal-flow" d="M 1052 612 L 1052 642"/>
  <path class="internal-flow" d="M 1347 612 L 1347 642"/>
  <path class="internal-flow" d="M 1052 714 L 1052 744"/>
  <path class="internal-flow" d="M 1347 714 L 1347 744"/>
  <path class="resource-flow" d="M 1200 802 L 1200 828"/>

  <!-- Cross-zone flows -->
  <path class="control-flow" d="M 680 548 C 680 430, 635 420, 635 371"/>
  <path class="control-flow" d="M 700 780 C 845 760, 835 430, 665 371"/>
  <text class="small" x="713" y="414">등록/할당 요청</text>

  <path class="data-flow" d="M 535 575 C 700 575, 785 678, 925 678"/>
  <text class="small" x="674" y="604">CUDA RPC · tensor data</text>

  <path class="data-flow" d="M 535 842 C 730 842, 878 678, 1220 678"/>
  <text class="small" x="748" y="816">CUDA RPC · tensor data</text>

  <path class="control-flow" d="M 815 274 C 1030 170, 1190 390, 1200 550"/>
  <text class="small" x="1008" y="196">GPU Cell 등록 · Virtual Server 제어</text>

  <path class="resource-flow" d="M 1405 358 L 1405 486"/>
  <text class="small" x="1420" y="415">GPU 소유권</text>

  <!-- Legend -->
  <rect x="104" y="963" width="18" height="4" rx="2" fill="#3178c6"/>
  <text class="small" x="132" y="970">Control flow</text>
  <rect x="250" y="963" width="18" height="4" rx="2" fill="#e36b2c"/>
  <text class="small" x="278" y="970">CUDA data flow</text>
  <rect x="420" y="963" width="18" height="4" rx="2" fill="#238b72"/>
  <text class="small" x="448" y="970">GPU resource ownership</text>
  <text class="small" x="1010" y="970">실측 상태: VM A/B, Cluster Manager, MongoDB, GPU Cell Running · GPU 2 whole claim 유지</text>
</svg>
