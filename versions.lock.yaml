schemaVersion: 2
runtime:
  transport: shm-only
  abi: '1.0'
  sourceDirectory: runtime/shm
  rpcFallback: false
  legacyDirectory: legacy/rpc
  validation: NOT_RUN
toolchain:
  cuda: 12.8.1
  cudnnMajor: 9
  cStandard: C11
  cmakeMinimum: '3.18'
compatibility:
  fullPyTorch: NOT_IMPLEMENTED
  graph: empty-node-lifecycle-only
  kernel: explicit-PTX-ABI-only
  cuBLAS: float-SGEMM-subset
  cuDNN: handle-and-version-only
