name: static-validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Parse SHM Python and deployment JSON
        run: |
          python3 - <<'PYCODE'
          import ast, json
          from pathlib import Path
          for root in ('runtime/shm/control', 'scripts'):
              for p in Path(root).glob('*.py'):
                  ast.parse(p.read_text(), filename=str(p))
          for p in Path('deploy/shm').glob('*.json'):
              json.loads(p.read_text())
          PYCODE
