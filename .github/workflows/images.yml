name: runtime-images

on:
  pull_request:
    paths:
      - images/**
      - runtime/shm/**
      - experiments/shm-queue/**
      - experiments/cuda-dispatch/**
      - experiments/shm-contract/**
      - versions.lock.yaml
      - .github/workflows/images.yml
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [control-plane, worker, guest-artifacts]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/flyt/Containerfile
          target: ${{ matrix.target }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ghcr.io/${{ github.repository_owner }}/flyt-${{ matrix.target }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
